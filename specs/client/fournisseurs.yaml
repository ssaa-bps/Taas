code: SPEC-FRN-001
titre: Gestion du cycle fournisseur dans Ivalua
contenu: |
  Contexte

  Ivalua permet aux utilisateurs habilités de référencer des fournisseurs, d'importer et de traiter des factures fournisseurs, et de gérer les demandes d'achat jusqu'à la génération des commandes.

  1. Référencement fournisseur

  Un utilisateur habilité peut créer une demande de référencement contenant la raison sociale, le pays, l'adresse, l'identifiant fiscal, le nom du contact principal, son adresse e-mail et la catégorie du fournisseur.

  L'utilisateur peut enregistrer la demande en brouillon et la compléter ultérieurement.

  Une demande en brouillon ne doit pas être considérée comme soumise à validation.

  